<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<title>养成创作 - 妙搭小站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root{ --bg:#0f0d08; --txt:#e8dcc8; --sub:#9a8868; --gold:#d4a84b; --c:#ff6fa5; }
  html,body{background:var(--bg);}
  body { min-height:100vh; font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--txt);
    display:flex; flex-direction:column; align-items:center; padding:30px 20px 40px;
    background: radial-gradient(ellipse at 18% 0%, rgba(255,111,165,.10) 0%, transparent 52%),
      radial-gradient(ellipse at 85% 8%, rgba(70,195,154,.08) 0%, transparent 48%),
      radial-gradient(ellipse at 80% 100%, rgba(212,168,75,.07) 0%, transparent 50%), var(--bg); }
  .top{width:100%;max-width:1180px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;text-decoration:none;
    background:rgba(212,168,75,.08);border:1px solid rgba(212,168,75,.3);color:var(--sub);font-size:13px;transition:.2s;}
  .back:hover{color:var(--gold);border-color:var(--gold);}
  .head{text-align:center;margin-bottom:6px;}
  .head h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:36px;letter-spacing:8px;
    background:linear-gradient(135deg,#ff9ec3,#ff6fa5 45%,#ffc0d8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .head p{color:var(--sub);font-size:13px;letter-spacing:5px;margin-top:8px;}
  .cards{display:grid;grid-template-columns:1fr;gap:20px;width:100%;max-width:1180px;margin-top:22px;}
  .app-card{ --c:#ff6fa5; border-radius:14px; position:relative; overflow:hidden; text-decoration:none;
    border:1px solid color-mix(in srgb,var(--c) 26%,transparent);
    background:linear-gradient(160deg,color-mix(in srgb,var(--c) 9%,#14110b) 0%,#14110b 72%);
    display:flex; flex-direction:column; transition:transform .25s,box-shadow .25s,border-color .25s; min-height:250px;}
  .app-card:hover{transform:translateY(-4px);box-shadow:0 14px 40px color-mix(in srgb,var(--c) 24%,transparent);border-color:var(--c);}
  .app-card::before{content:"";position:absolute;top:-24%;right:-24%;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,color-mix(in srgb,var(--c) 26%,transparent) 0%,transparent 70%);opacity:.5;pointer-events:none;}
  .cc{position:relative;z-index:1;padding:22px 22px 20px;display:flex;flex-direction:column;flex:1;min-width:0;}
  .ci{width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--c);
    background:color-mix(in srgb,var(--c) 14%,transparent);border:2px solid color-mix(in srgb,var(--c) 40%,transparent);margin-bottom:14px;}
  .ct{font-size:21px;font-weight:bold;color:var(--c);font-family:"STKaiti","KaiTi",serif;letter-spacing:2px;}
  .ce{font-size:10.5px;letter-spacing:1.5px;color:var(--sub);margin-top:3px;text-transform:uppercase;}
  .cd{font-size:12.5px;line-height:1.8;color:rgba(255,255,255,.6);margin-top:9px;flex:1;}
  .cb{margin-top:12px;padding:8px 16px;border-radius:7px;font-size:13px;letter-spacing:2px;align-self:flex-start;
    color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid var(--c);transition:.2s;}
  .app-card:hover .cb{background:var(--c);color:#14110b;}
  .foot{margin-top:30px;color:#6a5a3e;font-size:12px;letter-spacing:2px;text-align:center;}
  @media (min-width:768px){
    .cards{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:520px){
    body{padding:20px 12px 30px;}
    .head h1{font-size:28px;letter-spacing:5px;}
  }

  /* ===== 三布局切换 ===== */
  .layout-switch{display:inline-flex;gap:4px;padding:4px;border-radius:99px;background:rgba(212,168,75,.08);border:1px solid rgba(212,168,75,.25);}
  .layout-switch button{appearance:none;border:0;cursor:pointer;padding:8px 14px;border-radius:99px;background:transparent;color:var(--sub);font-size:13px;letter-spacing:1px;font-family:inherit;transition:.2s;}
  .layout-switch button:hover{color:var(--txt);}
  .layout-switch button.active{background:var(--gold);color:#14110b;font-weight:600;}
  .layout-body{width:100%;max-width:1180px;margin-top:22px;display:grid;gap:22px;min-width:0;}
  .sidebar{min-width:0;display:none;}
  .side-block{border-radius:16px;border:1px solid rgba(212,168,75,.22);padding:18px;background:linear-gradient(165deg,rgba(212,168,75,.07),#14110b 70%);}
  .side-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:bold;color:var(--gold);letter-spacing:2px;margin-bottom:14px;}
  .side-title::before{content:"";width:5px;height:16px;border-radius:3px;background:var(--gold);}
  .side-links{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .side-links a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:10px;background:rgba(255,255,255,.04);text-decoration:none;transition:.2s;}
  .side-links a:hover{background:rgba(212,168,75,.12);}
  .side-links .s-ic{font-size:22px;color:var(--gold);}
  .side-links .s-name{font-size:12px;color:var(--txt);}

  body[data-layout="two-col"] .layout-body{grid-template-columns:1fr 300px;}
  body[data-layout="two-col"] .sidebar{display:block;}
  body[data-layout="two-col"] .cards{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}

  body[data-layout="portal"] .cards{grid-template-columns:1fr;gap:14px;}
  body[data-layout="portal"] .app-card{flex-direction:row;align-items:center;min-height:0;padding:20px 24px;}
  body[data-layout="portal"] .cc{flex-direction:row;align-items:center;gap:20px;flex:1;}
  body[data-layout="portal"] .ci{margin:0;flex:0 0 52px;width:52px;height:52px;font-size:26px;}
  body[data-layout="portal"] .card-text{flex:1;min-width:0;}
  body[data-layout="portal"] .cd{margin-top:6px;}
  body[data-layout="portal"] .cb{margin-top:0;white-space:nowrap;}

  body[data-layout="grid"] .cards{gap:16px;}
  body[data-layout="grid"][data-cols="1"] .cards{grid-template-columns:1fr;}
  body[data-layout="grid"][data-cols="2"] .cards{grid-template-columns:repeat(2,1fr);}
  body[data-layout="grid"][data-cols="3"] .cards{grid-template-columns:repeat(3,1fr);}
  body[data-layout="grid"][data-cols="4"] .cards{grid-template-columns:repeat(4,1fr);}
  .grid-last-wide{grid-column:1/-1;}
  body[data-layout="grid"] .app-card{min-height:0;padding:18px 14px;align-items:center;text-align:center;}
  body[data-layout="grid"] .cc{align-items:center;}
  body[data-layout="grid"] .ci{margin:0;width:56px;height:56px;font-size:28px;}
  body[data-layout="grid"] .ct{margin-top:12px;font-size:18px;letter-spacing:2px;}
  body[data-layout="grid"] .ce,body[data-layout="grid"] .cd,body[data-layout="grid"] .cb{display:none;}

  @media (max-width:960px){ body[data-layout="two-col"] .layout-body{grid-template-columns:1fr;} }
  @media (max-width:520px){ body[data-layout="grid"] .cards{grid-template-columns:repeat(3,1fr);gap:10px;} }
</style>
</head>

<script>
// 源码保护
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    var key = e.key.toLowerCase();
    if (key === 'f12') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 'u') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 's') { e.preventDefault(); return; }
  });
  document.addEventListener('selectstart', function(e){
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
})();
</script>

<script>
(function(){
  var KEY="tanlan-layout";
  var body=document.body;
  var btns=Array.prototype.slice.call(document.querySelectorAll(".layout-switch button"));
  function applyLayout(l){
    if(["portal","two-col","grid"].indexOf(l)===-1) l="two-col";
    body.setAttribute("data-layout",l);
    var all=body.querySelectorAll(".app-card");
    all.forEach(function(c){c.classList.remove("grid-last-wide");});
    var cols=3;
    if(l==="grid"){
      var n=all.length;
      cols=n<=2?n:(n%4===0?4:3);
      body.setAttribute("data-cols",String(cols));
      if(n%cols===1){all[n-1].classList.add("grid-last-wide");}
    }else{body.removeAttribute("data-cols");}
    btns.forEach(function(b){b.classList.toggle("active",b.getAttribute("data-layout")===l);});
    try{localStorage.setItem(KEY,l);}catch(e){}
  }
  btns.forEach(function(btn){btn.addEventListener("click",function(){applyLayout(btn.getAttribute("data-layout"));});});
  var saved="two-col";
  try{saved=localStorage.getItem(KEY)||"two-col";}catch(e){}
  applyLayout(saved);
})();
</script>
